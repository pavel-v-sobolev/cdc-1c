[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "cdc-1c"
version = "0.1.8"
description = "Change data capture (CDC) from 1C:Enterprise to your data warehouse"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "dbmerge>=1.0.20",
    "requests>=2.33.0",
    "sqlalchemy>=2.0.49",
    "xmltodict>=1.0.4",
]

keywords = [
    "1c", "1c-enterprise", "cdc", "data-engineering", "etl", "dwh", "python", "postgres"
]

authors = [
  { name="Pavel Sobolev", email="pavel-v-sobolev@yandex.ru" },
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.12",
]
dev = [
    "pytest>=8",
]

[project.scripts]
cdc-1c = "cdc_1c.__main__:main"

[project.urls]
Homepage = "https://github.com/pavel-v-sobolev/cdc_1C"
Repository = "https://github.com/pavel-v-sobolev/cdc_1C"
Issues = "https://github.com/pavel-v-sobolev/cdc_1C/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# По умолчанию гоняем только офлайн-тесты; live-тесты 1С/Postgres — под маркером integration.
addopts = "-m 'not integration'"
markers = [
    "integration: требует живого сервера 1С и Postgres (параметры из main.py)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_1c"]
