[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "cdc-1c"
version = "0.1.0"
description = "Change data capture (CDC) from 1C:Enterprise to your data warehouse"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "dbmerge>=1.0.18",
    "polars>=1.41.2",
    "psycopg2>=2.9.12",
    "requests>=2.33.0",
    "sqlalchemy>=2.0.49",
    "xmltodict>=1.0.4",
]

keywords = [
    "1c", "1c-enterprise", "cdc", "data-engineering", "etl", "dwh", "python", "postgres"
]

authors = [
  { name="Pavel Sobolev", email="pavel-v-sobolev@yandex.ru" },
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: требует живого сервера 1С и Postgres (параметры из main.py)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_1c"]
